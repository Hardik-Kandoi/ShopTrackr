<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Guesser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Jersey+10&family=Jersey+15&family=Londrina+Outline&display=swap" rel="stylesheet">
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: linear-gradient(to bottom right, #212529, #adb5bd);
            min-height: 100vh;
            text-align: center;
            animation: fade 1s ease-in;
        }
        #heading{
            font-family: "Jersey 10", sans-serif;
            letter-spacing: 2px;
            font-weight: normal;
            font-size: 50px;
            text-shadow: 0 0 5px white, 0 0 15px white ;
            animation: pulse 2s linear infinite alternate;

        }
        #card{
            will-change: transform;
            min-width: 300px;
            min-height: 520px;
            border-radius: 12px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.178);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.377);
            border-radius: 16px;
            animation: card_animation 1s ease, float 4s ease-in-out 0.8s infinite;
            box-shadow: 0px 10px 15px rgba(0, 0, 0, 0.267);


        }
        label{
            font-family:"Jersey 15", sans-serif;
            font-weight: normal;
            letter-spacing: 2px;
            font-size: 25px;
            color: white;
        }
        p{
            font-family:"Jersey 15", sans-serif;
            font-weight: normal;
            letter-spacing: 2px; 
            font-size: 25px;
            color: white;
        }
        input{
            width: 190px;
            height: 25px;
            border-radius: 9999px;
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.096);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.377);
            outline: none;
            color: white;
            font-size: 18px;
            transition: 0.5s ease;
        }
        input:hover{
            background: rgba(255, 255, 255, 0);
            transform: translateY(-3px);
            box-shadow: 0px 10px 15px rgba(0, 0, 0, 0.267);
        }
        input:focus{
            background: rgba(255, 255, 255, 0);
            transform: translateY(-3px);
            box-shadow: 0px 10px 15px rgba(0, 0, 0, 0.267);
        }
        input::placeholder{
            color: rgba(255, 255, 255, 0.589);
        }
        input::-webkit-inner-spin-button,
        input::-webkit-outer-spin-button{
            -webkit-appearance: none;
            margin: 0;
        }
        button{
            width: 140px;
            height: 40px;
            border-radius: 18px;
            background: white;
            border: white;
            font-size: 20px;
            padding: 8px;
            font-family: "Jersey 10", sans-serif;
            transition: transform 0.5s ease;
        }
        button:active{
            transform: scale(.95);
        }
        button:hover{
            transform: translateY(-3px);
            box-shadow: 0px 8px 13px rgba(0, 0, 0, 0.267);
        }
        #rule_heading{
            font-family: "Jersey 10", sans-serif;
            font-size: 20px;
        }
        @keyframes card_animation{
            from{
                opacity: 0;
                transform: translateY(40px) scale(0.9);
            }
            to{
                opacity: 1;
                transform: translateY(0px) scale(1);
            }
        }
        @keyframes pulse{
            from{
                text-shadow: 
                            0 0 5px white, 
                            0 0 15px white;
            }
            to{
                text-shadow: 
                            0 0 12px white,
                            0 0 30px white,
                            0 0 45px white;
            }
        }
        @keyframes fade{
            from{
                opacity: 0;
            }
            to{
                opacity: 1;
            }
        }
        @keyframes float{
            0%,100%{
                transform: translateY(0);
            }
            50%{
                transform: translateY(-8px);
            }
        }
    </style>
</head>
<body>
</br>
    <h1 id="heading">Guess the Number!</h1>
    <div id="card">
    </br>
        <label>Enter minimum range</label>
    </br>
    </br>
        <input type="number" id="min_range" placeholder="Enter number">
    </br>
    </br>
        <label>Enter maximum range</label>
    </br>
    </br>
        <input type="number" id="max_range" placeholder="Enter number">
    </br>
    </br>
        <button onclick="set_target()">Set Target</button>
    </br>
    </br>
    </br>
        <label>Guess the number</label>
    </br>
    </br>
        <input type="number" id="guess" placeholder="Enter number">
    </br>
    </br>
        <button id="check" onclick="check()">Guess</button>
    </br>
    </br>
        <p id="comment">Output</p>
    </div>
</br>
<p id="rule_heading">Rules</p>

</body>
<script>
    let guess_count = 1
    let random
    let comment

    function set_target(){
        let range_minimum = Number(document.getElementById("min_range").value)
        let range_maximum = Number(document.getElementById("max_range").value)
        random = parseInt((Math.random()*(range_maximum-range_minimum))+range_minimum)
        guess_count = 1
    }
    function check(){
        let guess = Number(document.getElementById("guess").value)
        comment = document.getElementById("comment")
        
        if(guess > random){
            comment.textContent="Lower"
            guess_count += 1
        }
        else if(guess < random){
            comment.textContent="Higher"
            guess_count += 1
        }
        else if(guess == random){
            comment.textContent="Guessed it in "+guess_count+" attempts"
        }
        else{
            comment.textContent="Something went wrong"
        }
          
    }

</script>
</html>
